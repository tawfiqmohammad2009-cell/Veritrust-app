name: Build Veritrust Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK Manually
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          unzip -q cmdline-tools.zip -d temp_tools
          mv temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          rm -rf cmdline-tools.zip temp_tools

          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK with AAPT and D8
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          mkdir -p build/classes build/gen
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f -m -J build/gen -S app/src/main/res -M app/src/main/AndroidManifest.xml -I $ANDROID_HOME/platforms/android-34/android.jar
          javac -d build/classes -classpath $ANDROID_HOME/platforms/android-34/android.jar app/src/main/java/com/veritrust/shield/MainActivity.java
          $ANDROID_HOME/build-tools/34.0.0/d8 --output build/ app/src/main/java/com/veritrust/shield/*.class build/classes/com/veritrust/shield/*.class
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f -M app/src/main/AndroidManifest.xml -S app/src/main/res -I $ANDROID_HOME/platforms/android-34/android.jar -F build/veritrust-unsigned.apk
          cd build && $ANDROID_HOME/build-tools/34.0.0/aapt add veritrust-unsigned.apk classes.dex && cd ..
          
          # Generate debug key and sign
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --out build/Veritrust.apk build/veritrust-unsigned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veritrust-APK
          path: build/Veritrust.apk
