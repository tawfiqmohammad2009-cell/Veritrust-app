name: Build Veritrust Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK Natively
        run: |
          echo "Downloading Android Command-Line Tools..."
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          unzip -q cmdline-tools.zip -d temp_tools
          mv temp_tools/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          rm -rf cmdline-tools.zip temp_tools

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          yes | sdkmanager --licenses || true
          sdkmanager --update
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK with AAPT and D8
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          mkdir -p build/classes build/gen app/src/main/res

          MANIFEST_PATH="app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST_PATH" ]; then
            MANIFEST_PATH="AndroidManifest.xml"
          fi

          RES_PATH="app/src/main/res"
          if [ -d "res" ]; then
            RES_PATH="res"
          fi

          # 1. Generate R.java
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f -m -J build/gen -S $RES_PATH -M $MANIFEST_PATH -I $ANDROID_HOME/platforms/android-34/android.jar

          # 2. Compile Java sources
          find . -name "*.java" > sources.txt
          javac -d build/classes -classpath $ANDROID_HOME/platforms/android-34/android.jar @sources.txt

          # 3. Dex classes
          find build/classes -name "*.class" > classes.txt
          $ANDROID_HOME/build-tools/34.0.0/d8 --output build/ @classes.txt

          # 4. Package resources and dex
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f -M $MANIFEST_PATH -S $RES_PATH -I $ANDROID_HOME/platforms/android-34/android.jar -F build/veritrust-unsigned.apk
          cd build && $ANDROID_HOME/build-tools/34.0.0/aapt add veritrust-unsigned.apk classes.dex && cd ..

          # 5. Keystore & Sign
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --out build/Veritrust.apk build/veritrust-unsigned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veritrust-APK
          path: build/Veritrust.apk
